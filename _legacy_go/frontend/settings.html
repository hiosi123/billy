<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건물 관리 설정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-menu {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .nav-menu a {
            display: inline-block;
            padding: 12px 25px;
            margin: 0 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .nav-menu a:hover {
            transform: translateY(-2px);
        }

        .nav-menu a.current {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .building-selector {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .building-selector h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            text-align: center;
        }

        .selector-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .selector-controls select {
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            min-width: 200px;
        }

        .selector-controls button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .selector-controls button:hover {
            transform: translateY(-2px);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .management-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .card.building-card h2 {
            border-bottom-color: #e74c3c;
        }

        .card.floor-card h2 {
            border-bottom-color: #27ae60;
        }

        .card.room-card {
            grid-column: 1 / -1;
        }

        .card.room-card h2 {
            border-bottom-color: #f39c12;
        }

        .room-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.2s ease;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-building {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .btn-floor {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .btn-room {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            grid-column: 1 / -1;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9rem;
            width: auto;
            margin: 2px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .data-table {
            width: 100%;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .table-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        .table-header.building {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .table-header.floor {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .table-header.room {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e1e1e1;
            min-width: 100px;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .data-table th {
            font-weight: 600;
            white-space: nowrap;
        }

        .data-table td {
            white-space: nowrap;
        }

        .actions {
            display: flex;
            gap: 5px;
            justify-content: center;
            min-width: 120px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .modal-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            margin-top: -10px;
            margin-right: -10px;
        }

        .close:hover {
            color: #e74c3c;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .building-info {
            background: #f8f9fa;
            border-left: 4px solid #e74c3c;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }

        .building-info h3 {
            color: #e74c3c;
            margin-bottom: 5px;
        }

        .building-info p {
            color: #666;
            margin: 2px 0;
        }

        .no-building-selected {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 10px;
            margin: 20px 0;
        }

        .hidden {
            display: none;
        }

        .form-section {
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }

        .form-section h4 {
            margin-bottom: 15px;
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        .info-badge {
            display: inline-block;
            background: #ffeaa7;
            color: #d63031;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-left: 5px;
        }

        @media (max-width: 1200px) {
            .management-section {
                grid-template-columns: 1fr;
            }
            
            .room-form-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .nav-menu a {
                display: block;
                margin: 5px 0;
            }
            
            .selector-controls {
                flex-direction: column;
            }
            
            .selector-controls select {
                min-width: auto;
                width: 100%;
            }
            
            .modal-content {
                width: 95%;
                margin: 10% auto;
                padding: 20px;
            }

            .data-table {
                font-size: 0.85rem;
            }

            .data-table th,
            .data-table td {
                padding: 8px 10px;
                font-size: 0.9rem;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 건물 관리 설정</h1>
            <p>건물, 층, 계량기 정보를 체계적으로 관리하세요</p>
        </div>

        <div class="nav-menu">
            <a href="/building" class="nav-btn">관리비 시스템</a>
            <a href="/settings" class="current nav-btn">설정 관리</a>
        </div>

        <div class="building-selector">
            <h2>🏢 관리할 건물 선택</h2>
            <div class="selector-controls">
                <select id="buildingSelector">
                    <option value="">건물을 선택하세요</option>
                </select>
                <button onclick="showAllBuildings()">전체 건물 관리</button>
                <button onclick="loadBuildingSelector()">목록 새로고침</button>
            </div>
        </div>

        <div class="main-grid">
            <div id="allBuildingsSection">
                <div class="card building-card">
                    <h2>🏢 건물 등록</h2>
                    <form id="buildingForm">
                        <div class="form-group">
                            <label for="buildingName">건물명 *</label>
                            <input type="text" id="buildingName" placeholder="예: 삼성빌딩" required>
                        </div>
                        <div class="form-group">
                            <label for="buildingOwner">소유자 *</label>
                            <input type="text" id="buildingOwner" placeholder="예: 홍길동" required>
                        </div>
                        <div class="form-group">
                            <label for="buildingAddress">주소</label>
                            <input type="text" id="buildingAddress" placeholder="예: 서울시 강남구 테헤란로 123">
                        </div>
                        <div class="form-group">
                            <label for="buildingFloors">총 층수</label>
                            <input type="number" id="buildingFloors" placeholder="예: 10" min="1">
                        </div>
                        <div class="form-group">
                            <label for="elevator">엘리베이터 수</label>
                            <input type="number" id="elevator" placeholder="예: 2" min="0">
                        </div>
                        <button type="submit" class="btn btn-building">건물 등록</button>
                    </form>
                    <div id="buildingMessage"></div>
                </div>

                <div style="margin-top: 30px;">
                    <h3 style="color: white; margin-bottom: 15px; font-size: 1.3rem;">🏢 등록된 건물 목록</h3>
                    <div id="buildingTableContainer">
                        <div class="loading">
                            <div class="spinner"></div>
                            건물 정보를 불러오는 중...
                        </div>
                    </div>
                </div>
            </div>

            <div id="selectedBuildingSection" class="hidden">
                <div id="buildingInfo" class="building-info"></div>

                <div class="management-section">
                    <div class="card floor-card">
                        <h2>🏬 층 관리</h2>
                        <form id="floorForm">
                            <div class="form-group">
                                <label for="floorNumber">층수 *</label>
                                <input type="number" id="floorNumber" placeholder="예: 3" required>
                            </div>
                            <div class="form-group">
                                <label for="floorSpace">층 면적 (㎡)</label>
                                <input type="number" id="floorSpace" placeholder="예: 150.5" step="0.1" min="0">
                            </div>
                            <button type="submit" class="btn btn-floor">층 등록</button>
                        </form>
                        <div id="floorMessage"></div>
                    </div>

                    <div class="card room-card">
                        <h2>📊 계량기 관리</h2>
                        <form id="roomForm">
                            <div class="room-form-grid">
                                <div class="form-section">
                                    <h4>기본 정보</h4>
                                    <div class="form-group">
                                        <label for="roomFloorSelect">소속 층 *</label>
                                        <select id="roomFloorSelect" required>
                                            <option value="">층을 선택하세요</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="roomNumber">호실 번호 *</label>
                                        <input type="number" id="roomNumber" placeholder="예: 301" required min="1">
                                    </div>
                                    <div class="form-group">
                                        <label for="roomName">호실명</label>
                                        <input type="text" id="roomName" placeholder="예: 사무실A">
                                    </div>
                                    <div class="form-group">
                                        <label for="roomSpace">호실 면적 (㎡)</label>
                                        <input type="number" id="roomSpace" placeholder="예: 25.5" step="0.1" min="0">
                                    </div>
                                </div>

                                <div class="form-section">
                                    <h4>계량기 및 요금 정보</h4>
                                    <div class="form-group">
                                        <label for="measureMachine">계량기 명칭</label>
                                        <input type="text" id="measureMachine" placeholder="예: 상수도계량기-A동">
                                    </div>
                                    <div class="form-group">
                                        <label for="measureNo">계량기 번호</label>
                                        <input type="number" id="measureNo" placeholder="예: 12345" min="0">
                                    </div>
                                    <div class="form-group">
                                        <label for="measureMultiply">계량기 배수</label>
                                        <input type="number" id="measureMultiply" placeholder="예: 1.0" step="0.1" min="0">
                                    </div>
                                    <div class="form-group">
                                        <label for="roomBaseCost">기본 요금 (원)</label>
                                        <input type="number" id="roomBaseCost" placeholder="예: 50000" min="0">
                                    </div>
                                </div>

                                <div class="form-section" style="grid-column: 1 / -1;">
                                    <h4>고정 사용량</h4>
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                        <div class="form-group">
                                            <label for="strictWater">고정 상수도 사용량</label>
                                            <input type="number" id="strictWater" placeholder="예: 10.5" step="0.1" min="0">
                                        </div>
                                        <div class="form-group">
                                            <label for="strictElectricity">고정 전기 사용량</label>
                                            <input type="number" id="strictElectricity" placeholder="예: 150.0" step="0.1" min="0">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-room">계량기 등록</button>
                        </form>
                        <div id="roomMessage"></div>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <h3 style="color: white; margin-bottom: 15px; font-size: 1.3rem;">🏬 층 목록</h3>
                    <div id="floorTableContainer">
                        <div class="no-building-selected">건물을 먼저 선택해주세요.</div>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <h3 style="color: white; margin-bottom: 15px; font-size: 1.3rem;">📊 계량기 목록</h3>
                    <div id="roomTableContainer">
                        <div class="no-building-selected">건물을 먼저 선택해주세요.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2 id="modalTitle">데이터 수정</h2>
            <form id="editForm">
                <div id="editFields"></div>
                <button type="submit" class="btn">수정 완료</button>
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">취소</button>
            </form>
            <div id="editMessage"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://billys.duckdns.org:3000/api/v1';
        let selectedBuilding = null;
        let currentEditData = null;
        let allRooms = []; // 전체 계량기 목록 캐시

        document.addEventListener('DOMContentLoaded', function() {
            loadBuildingSelector();
            loadBuildings();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('buildingSelector').addEventListener('change', selectBuilding);
            document.getElementById('buildingForm').addEventListener('submit', createBuilding);
            document.getElementById('floorForm').addEventListener('submit', createFloor);
            document.getElementById('roomForm').addEventListener('submit', createRoom);
            document.getElementById('editForm').addEventListener('submit', updateData);
            
            window.addEventListener('click', function(e) {
                if (e.target === document.getElementById('editModal')) {
                    closeEditModal();
                }
            });
        }

        async function loadBuildingSelector() {
            try {
                const response = await fetch(`${API_BASE_URL}/buildings`);
                const buildings = await response.json();
                
                const selector = document.getElementById('buildingSelector');
                selector.innerHTML = '<option value="">건물을 선택하세요</option>';
                
                buildings.data.forEach(building => {
                    const option = new Option(`${building.BuildingName} (${building.Owner})`, building.BuildingId);
                    selector.add(option);
                });
            } catch (error) {
                console.error('건물 선택 목록 로드 실패:', error);
            }
        }

        async function selectBuilding() {
            const buildingId = document.getElementById('buildingSelector').value;
            
            if (!buildingId) {
                showAllBuildings();
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/buildings/${buildingId}`);
                const building = await response.json();
                selectedBuilding = building.data;

                document.getElementById('allBuildingsSection').classList.add('hidden');
                document.getElementById('selectedBuildingSection').classList.remove('hidden');

                displayBuildingInfo(selectedBuilding);
                loadSelectedBuildingData(buildingId);

            } catch (error) {
                console.error('건물 정보 로드 실패:', error);
                alert('건물 정보를 불러올 수 없습니다.');
            }
        }

        function showAllBuildings() {
            selectedBuilding = null;
            document.getElementById('buildingSelector').value = '';
            document.getElementById('allBuildingsSection').classList.remove('hidden');
            document.getElementById('selectedBuildingSection').classList.add('hidden');
            loadBuildings();
        }

        function displayBuildingInfo(building) {
            const buildingInfoDiv = document.getElementById('buildingInfo');
            buildingInfoDiv.innerHTML = `
                <h3>📍 ${building.BuildingName}</h3>
                <p><strong>소유자:</strong> ${building.Owner}</p>
                <p><strong>주소:</strong> ${building.BuildingAddress || '-'}</p>
                <p><strong>총 층수:</strong> ${building.BuildingFloors || '-'}층 | <strong>엘리베이터:</strong> ${building.Elevator || 0}대</p>
            `;
        }

        async function loadSelectedBuildingData(buildingId) {
            try {
                const floorsResponse = await fetch(`${API_BASE_URL}/floors/buildings/${buildingId}`);
                const floors = await floorsResponse.json();
                displayFloorsTable(floors.data);
                loadFloorsForRoom(floors.data);

                const roomsResponse = await fetch(`${API_BASE_URL}/rooms/buildings/${buildingId}`);
                const rooms = await roomsResponse.json();
                allRooms = rooms.data; // 캐시 저장
                displayRoomsTable(rooms.data);

            } catch (error) {
                console.error('건물 데이터 로드 실패:', error);
                document.getElementById('floorTableContainer').innerHTML =

        async function updateData(e) {
            e.preventDefault();
            
            if (!currentEditData) return;
            
            const { type, data } = currentEditData;
            let updateData = {};
            let endpoint = '';
            
            if (type === 'building') {
                updateData = {
                    BuildingName: document.getElementById('editBuildingName').value.trim(),
                    Owner: document.getElementById('editOwner').value.trim(),
                    BuildingAddress: document.getElementById('editBuildingAddress').value.trim(),
                    BuildingFloors: parseInt(document.getElementById('editBuildingFloors').value) || 0,
                    Elevator: parseInt(document.getElementById('editElevator').value) || 0
                };
                endpoint = `buildings/${data.BuildingId}`;
            } else if (type === 'floor') {
                updateData = {
                    Floor: parseInt(document.getElementById('editFloor').value),
                    FloorSpace: parseFloat(document.getElementById('editFloorSpace').value) || 0
                };
                endpoint = `floors/${data.FloorId}`;
            } else if (type === 'room') {
                const isFirst = isFirstRoomNumber(allRooms, data);
                
                updateData = {
                    RoomNumber: parseInt(document.getElementById('editRoomNumber').value),
                    RoomName: document.getElementById('editRoomName').value.trim(),
                    MeasureMachine: document.getElementById('editMeasureMachine').value.trim(),
                    MeasureNo: parseInt(document.getElementById('editMeasureNo').value) || 0,
                    MeasureMultiply: parseFloat(document.getElementById('editMeasureMultiply').value) || 1.0,
                    StrictWater: parseFloat(document.getElementById('editStrictWater').value) || 0,
                    StrictElectricity: parseFloat(document.getElementById('editStrictElectricity').value) || 0
                };
                
                // 첫 번째 계량기만 면적과 기본요금 수정 가능
                if (isFirst) {
                    updateData.RoomSpace = parseFloat(document.getElementById('editRoomSpace').value) || 0;
                    updateData.RoomBaseCost = parseFloat(document.getElementById('editRoomBaseCost').value) || 0;
                }
                
                endpoint = `rooms/${data.RoomId}`;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/${endpoint}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });
                
                if (response.ok) {
                    showMessage('editMessage', '정보가 성공적으로 수정되었습니다!', 'success');
                    
                    if (type === 'building') {
                        loadBuildings();
                        loadBuildingSelector();
                        if (selectedBuilding && selectedBuilding.BuildingId === data.BuildingId) {
                            selectBuilding();
                        }
                    } else if ((type === 'floor' || type === 'room') && selectedBuilding) {
                        loadSelectedBuildingData(selectedBuilding.BuildingId);
                    }
                    
                    setTimeout(() => {
                        closeEditModal();
                    }, 2000);
                } else {
                    const error = await response.json();
                    showMessage('editMessage', `오류: ${error.error || '수정에 실패했습니다.'}`, 'error');
                }
            } catch (error) {
                showMessage('editMessage', '서버 연결에 실패했습니다.', 'error');
            }
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            setTimeout(() => {
                element.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
