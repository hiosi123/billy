server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter Web SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter 진입점 JS + 서비스워커.
    # 파일명이 빌드마다 바뀌지 않으므로(고정명) 반드시 매 로드 재검증해야
    # 배포 즉시 새 빌드가 반영된다. ETag 기반이라 변경 없으면 304(본문 없음)로 저렴.
    # (max-age=604800 으로 캐싱하면 기존 사용자가 최대 7일간 옛 버전에 묶임)
    location ~* \.(?:js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 매니페스트/버전 json 도 고정명이라 항상 재검증 (작아서 비용 미미)
    location ~* \.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 그 외 정적 자원(이미지·폰트·wasm·css 등): 잘 바뀌지 않으므로 장기 캐시
    location ~* \.(?:css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # canvaskit / assets 디렉토리(안정적): 장기 캐시
    location ~* ^/(canvaskit|assets)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html 은 캐시하지 않음 (배포 후 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
