name: billy_frontend
description: "Billy — 건물 관리비 관리"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  go_router: ^17.5.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # 한글 폰트를 번들한다(상용 2,350자 + 자모 + 라틴 서브셋, ddiding 과 같은 파일, OFL 1.1 — assets/fonts/OFL.txt).
  # 웹(CanvasKit)은 번들 폰트에 없는 글자를 구글 CDN 폴백으로 그려서, 안 넣으면 한글이 받아올 때까지 □ 로 깜빡였다.
  # 같은 파일을 'Roboto' 로도 등록한다 — 엔진 기본 글꼴이 Roboto 라 스타일 없는 자리도 CDN 을 안 부른다.
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700

# 런처 아이콘 생성: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true # 앱스토어 아이콘은 투명 픽셀이 있으면 거절된다
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1B2A4A"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1B2A4A"
    theme_color: "#1B2A4A"
